name: CALIBRE SECURITY SEC-004 Check

on:
  push:
    paths:
      - 'sec004/**'
      - '.github/workflows/sec004-check.yml'
  pull_request:
    paths:
      - 'sec004/**'
      - '.github/workflows/sec004-check.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sec004
    steps:
      - uses: actions/checkout@v4
      - name: Rust versions
        run: rustc --version && cargo --version
      - name: Test SEC-004
        run: cargo test --release
      - name: Run SEC-004
        run: cargo run --release
