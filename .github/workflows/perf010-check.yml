name: CALIBRE GEN2 PERF-010 Check

on:
  push:
    paths:
      - 'perf010/**'
      - '.github/workflows/perf010-check.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: perf010
    steps:
      - uses: actions/checkout@v4
      - name: Rust versions
        run: rustc --version && cargo --version
      - name: Test PERF-010
        run: cargo test --release
      - name: Smoke PERF-010
        run: cargo run --release -- --txs 100000 --arities 8 --workers 4 --shards 256 --conflicts 0,10 --batches 1024 --streams 2 --sizes 128
