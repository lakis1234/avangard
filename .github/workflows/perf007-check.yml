name: CALIBRE GEN2 PERF-007 Check

on:
  push:
    paths:
      - 'perf007/**'
      - '.github/workflows/perf007-check.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: perf007
    steps:
      - uses: actions/checkout@v4
      - name: Rust versions
        run: rustc --version && cargo --version
      - name: Test PERF-007
        run: cargo test --release
      - name: Smoke PERF-007
        run: cargo run --release -- --txs 100000 --arities 8 --workers 4 --shards 256 --conflicts 0,10 --batches 256,1024,4096
